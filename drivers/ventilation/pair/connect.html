<style>
  .kv-row { margin-bottom: 14px; }
  #kv-status { margin-top: 12px; min-height: 1.4em; }
  .kv-err { color: #c0392b; }
  .kv-ok { color: #27ae60; }
</style>

<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.subtitle"></p>
</header>

<div class="homey-form">
  <div class="kv-row homey-form-group">
    <label class="homey-form-label" for="kv-host" data-i18n="pair.ip"></label>
    <input class="homey-form-input" id="kv-host" type="text" placeholder="192.168.1.50" />
  </div>
  <div class="kv-row homey-form-group">
    <label class="homey-form-label" for="kv-port" data-i18n="pair.port"></label>
    <input class="homey-form-input" id="kv-port" type="number" value="8234" />
  </div>
  <button class="homey-button-primary-full" id="kv-test" data-i18n="pair.test"></button>
  <div id="kv-status"></div>
</div>

<script type="application/javascript">
  const btn = document.getElementById('kv-test');
  const status = document.getElementById('kv-status');

  btn.addEventListener('click', async () => {
    const host = document.getElementById('kv-host').value.trim();
    const port = Number(document.getElementById('kv-port').value) || 8234;
    status.className = '';
    status.textContent = Homey.__('pair.waiting');
    btn.disabled = true;
    try {
      const s = await Homey.emit('test_connection', { host, port });
      status.className = 'kv-ok';
      status.textContent = `${Homey.__('pair.found')} – ${s.targetTemperature} °C`;
      setTimeout(() => Homey.showView('list_devices'), 800);
    } catch (err) {
      status.className = 'kv-err';
      status.textContent = err.message || String(err);
      btn.disabled = false;
    }
  });
</script>
